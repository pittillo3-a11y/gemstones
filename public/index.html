<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Project Gem Stones</title>
  <style>
    body { background:#111; color:#ddd; font-family: monospace; margin:0; padding:1em; }
    #log { white-space: pre-wrap; height: 70vh; overflow-y: auto; border:1px solid #333; padding:1em; }
    #input { width:100%; background:#222; color:#ddd; border:1px solid #444; padding:0.5em; font-family:monospace; }
  </style>
</head>
<body>
  <div id="log">Connecting...</div>
  <input id="input" placeholder="Type a command and press Enter" autofocus>
  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const ws = new WebSocket(`ws://${location.host}`);
    function add(text) {
      log.textContent += text + '\n';
      log.scrollTop = log.scrollHeight;
    }
    ws.onopen = () => {
      const name = prompt('What is your name?', 'Traveler') || 'Traveler';
      ws.send(JSON.stringify({ type:'login', name }));
    };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'text') add(msg.text);
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim()) {
        ws.send(JSON.stringify({ type:'command', text: input.value }));
        input.value = '';
      }
    });
  </script>
</body>
</html>
